[project]
name = "blackwall"
version = "2.0.0"
description = "Rank open models on an NVIDIA RTX PRO 6000 Blackwell: speed and answer quality, one leaderboard."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "guitaripod" }]
keywords = ["llm", "benchmark", "leaderboard", "rtx-pro-6000", "blackwell", "nvidia", "llama-swap", "llama.cpp", "sglang", "local-llm"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai>=1.40",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "tokenizers>=0.19",
  "huggingface_hub>=0.24",
  "pyyaml>=6",
  "math-verify>=0.9",
]

[project.urls]
Homepage = "https://github.com/guitaripod/blackwall"
Issues = "https://github.com/guitaripod/blackwall/issues"

[project.scripts]
blackwall = "blackwall.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackwall"]
